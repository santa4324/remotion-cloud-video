name: Render Video
on: [push]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - run: npx remotion browser install
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
